<!DOCTYPE html>
<html>
<head>
    <title>Resimli Kart Oyunu</title>
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f4f4f4; }
        .oyun-alani { display: block; margin: 20px auto; }

        .kart {
            width: 100px; height: 120px; 
            display: inline-block; margin: 10px;
            perspective: 1000px; cursor: pointer;
        }

        .kart-ic {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .dondu { transform: rotateY(180deg); }

        .on, .arka {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 10px;
            line-height: 120px; font-size: 50px; text-align: center;
            overflow: hidden; 
        }

        .on { background-color: #e74c3c; color: white; border: 2px solid #c0392b; }
        .arka { background-color: white; transform: rotateY(180deg); border: 2px solid #ccc; }
        
        
        img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <h2>Görsel Eşleştirme Oyunu</h2>

    <div class="oyun-alani">
      
        <div class="kart" onclick="kartiAc('k1', 'elma')">
            <div id="k1" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="el.jpg"></div>
            </div>
        </div>
        <div class="kart" onclick="kartiAc('k2', 'elma')">
            <div id="k2" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="el.jpg"></div>
            </div>
        </div>


        <div class="kart" onclick="kartiAc('k3', 'armut')">
            <div id="k3" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="ar.jpg"></div>
            </div>
        </div>
        <div class="kart" onclick="kartiAc('k4', 'armut')">
            <div id="k4" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="ar.jpg"></div>
            </div>
        </div>

        <br>

        <div class="kart" onclick="kartiAc('k5', 'kiraz')">
            <div id="k5" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="ki.jpg"></div>
            </div>
        </div>
        <div class="kart" onclick="kartiAc('k6', 'kiraz')">
            <div id="k6" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="ki.jpg"></div>
            </div>
        </div>

        <div class="kart" onclick="kartiAc('k7', 'portakal')">
            <div id="k7" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="po.jpg"></div>
            </div>
        </div>
        <div class="kart" onclick="kartiAc('k8', 'portakal')">
            <div id="k8" class="kart-ic">
                <div class="on">?</div>
                <div class="arka"><img src="po.jpg"></div>
            </div>
        </div>
    </div>

    <script>
        let birinciID = null;
        let birinciIsim = null;
        let kilit = false;

        function kartiAc(kartId, resimIsmi) {
            if (kilit) return;

            let secilenKart = document.getElementById(kartId);
            if (secilenKart.classList.contains("dondu")) return;

            secilenKart.classList.add("dondu");

            if (birinciID == null) {
                birinciID = kartId;
                birinciIsim = resimIsmi;
            } else {
                if (birinciIsim === resimIsmi) {
                    
                    birinciID = null;
                    birinciIsim = null;
                } else {
                   
                    kilit = true;
                    setTimeout(function() {
                        document.getElementById(birinciID).classList.remove("dondu");
                        secilenKart.classList.remove("dondu");
                        birinciID = null;
                        birinciIsim = null;
                        kilit = false;
                    }, 1000);
                }
            }
        }
    </script>

</body>
</html>
