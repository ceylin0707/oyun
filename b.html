    <meta charset="UTF-8">
    <title>Üyelik Kaydı</title>
</head>
<body style="background-color: pink;">

    <p><a href="Index.html">geri dön</a></p>

    <input type="text" id="adSoyad" placeholder="AD SOYAD"><br><br>
    <input type="email" id="email" placeholder="EMAİL"><br><br>
    <input type="text" id="takim" placeholder="TUTTUĞU TAKIM"><br><br>
    
    <button id="kaydetButonu">kaydet</button>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
      import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

      // Sizin Firebase yapılandırma bilgileriniz
      const firebaseConfig = {
        apiKey: "AIzaSyB8jBASc3oZDnp9jyanQ6ocpqWi0oAzMSM",
        authDomain: "ornekproje-69d22.firebaseapp.com",
        projectId: "ornekproje-69d22",
        storageBucket: "ornekproje-69d22.firebasestorage.app",
        messagingSenderId: "831183825516",
        appId: "1:831183825516:web:9a0573216b7ec4fddfc649",
        measurementId: "G-FNENLXWB67"
      };

      // Firebase ve Veritabanı Servisini Başlatıyoruz
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // HTML kutularını ve butonunu JavaScript'e tanıtıyoruz
      const adSoyadInput = document.getElementById('adSoyad');
      const emailInput = document.getElementById('email');
      const takimInput = document.getElementById('takim');
      const kaydetButon = document.getElementById('kaydetButonu');

      // Kaydet butonuna tıklandığında çalışacak olan işlem
      kaydetButon.addEventListener('click', async () => {
        const adSoyad = adSoyadInput.value;
        const email = emailInput.value;
        const takim = takimInput.value;

        // Alanlar boş mu kontrol ediyoruz
        if(!adSoyad || !email || !takim) {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        try {
          // "uyeler" adında bir koleksiyon oluşturup verileri Firebase'e gönderiyoruz
          const docRef = await addDoc(collection(db, "uyeler"), {
            isim: adSoyad,
            eposta: email,
            takim: takim,
            tarih: new Date()
          });
          
          alert("Kullanıcı başarıyla Firebase'e kaydedildi!");
          
          // Kutuları temizle
          adSoyadInput.value = "";
          emailInput.value = "";
          takimInput.value = "";

        } catch (error) {
          console.error("Hata oluştu:", error);
          alert("Veri kaydedilirken hata oluştu: " + error.message);
        }
      });
    </script>

</body>
</html>
